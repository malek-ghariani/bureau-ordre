<h2 class="mt-3 mb-3">
  Liste des documents
  <span *ngIf="role === 'RESPONSABLE'"> - {{ type | titlecase }}</span>
</h2>

<div *ngIf="role === 'RESPONSABLE'" class="btn-group mb-3 d-block">
  <button class="btn btn-primary" (click)="changeType('entrant')">Courriers Entrants</button>
  <button class="btn btn-secondary" (click)="changeType('sortant')">Courriers Sortants</button>
</div>

<div class="mb-3" *ngIf="role === 'RESPONSABLE'">
  <button class="btn btn-success" (click)="createDocument()">
    <i class="fas fa-plus"></i> Nouveau Courrier
  </button>
</div>
<!-- FILTRES -->
<div class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="row">
      <div class="col-md-4">
        <input type="text" class="form-control"
               placeholder="Référence..."
               [(ngModel)]="filtreReference">
      </div>
      <div class="col-md-3">
        <input type="date" class="form-control"
               [(ngModel)]="filtreDateDebut">
      </div>
      <div class="col-md-3">
        <input type="date" class="form-control"
               [(ngModel)]="filtreDateFin">
      </div>
      <div class="col-md-2">
        <button class="btn btn-secondary w-100" (click)="resetFiltres()">
          🔄 Réinitialiser
        </button>
      </div>
    </div>
  </div>
</div>

<div class="table-responsive">
  <table class="table table-bordered table-hover">
    <thead class="thead-light">
  <tr>
    <th>Numéro ordre</th>
    <th>Référence</th>
    <th>Type</th>
    <th>Statut</th>
    <th>Date</th>
    <th>État</th>
    <th>Priorité</th>
    <th>Actions</th>
  </tr>
</thead>
    <tbody>
      <tr *ngFor="let doc of documentsFiltres">

  <td>{{ doc.numeroOrdre }}</td>
  <td>{{ doc.reference }}</td>
  <td>{{ doc.typeDocument }}</td>

  <td>
    <span class="badge" [ngClass]="{
  'badge-secondary': doc.statut === 'NOUVEAU',
  'badge-primary':   doc.statut === 'EN_COURS',
  'badge-success':   doc.statut === 'TRAITE',
  'badge-dark':      doc.statut === 'ARCHIVE'
}">{{ doc.statut }}</span>
  </td>

  <td>
    {{ type === 'entrant' ? doc.dateReception : doc.dateEmission }}
  </td>

  <td>
    <span class="badge badge-dark">{{ doc.etat }}</span>
  </td>

  <td>
    <span class="badge badge-warning">{{ doc.priorite }}</span>
  </td>

  <!-- ✅ TOUTES LES ACTIONS ICI -->
  <td>
  <!-- Voir -->
  <button class="btn btn-primary btn-sm mr-1 mb-1"
          (click)="viewDocument(doc)">
    <i class="material-icons">visibility</i>
  </button>

  <!-- Modifier — seulement si NOUVEAU -->
  <button *ngIf="role === 'RESPONSABLE' && doc.statut === 'NOUVEAU'"
          class="btn btn-info btn-sm mr-1 mb-1"
          (click)="editDocument(doc)">
    <i class="material-icons">edit</i>
  </button>

  <!-- Envoyer — seulement si NOUVEAU ou EN_COURS -->
  <button *ngIf="role === 'RESPONSABLE' && (doc.statut === 'NOUVEAU' || doc.statut === 'EN_COURS')"
          class="btn btn-success btn-sm mr-1 mb-1"
          (click)="openSendModal(doc)">
    <i class="material-icons">send</i>
  </button>

  <!-- Marquer traité — seulement si EN_COURS -->
  <button *ngIf="role === 'RESPONSABLE' && doc.statut === 'EN_COURS'"
          class="btn btn-warning btn-sm mr-1 mb-1"
          (click)="marquerTraite(doc)"
          title="Marquer comme traité">
    <i class="material-icons">done_all</i>
  </button>

  <!-- Archiver — seulement si TRAITE -->
<button *ngIf="role === 'RESPONSABLE' && doc.statut === 'TRAITE' && doc.etat !== 'ARCHIVE'"
        class="btn btn-dark btn-sm mr-1 mb-1"
        (click)="archiver(doc)"
        title="Archiver">
  <i class="material-icons">archive</i>
</button>

  <!-- Supprimer — seulement si NOUVEAU -->
  <button *ngIf="role === 'RESPONSABLE' && doc.statut === 'NOUVEAU'"
          class="btn btn-danger btn-sm mb-1"
          (click)="deleteDocument(doc.id!)">
    <i class="material-icons">delete</i>
  </button>
</td>

</tr>
    </tbody>
  </table>
</div>
